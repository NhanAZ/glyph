name: Update Vanilla Textures

on:
  schedule:
    - cron: "0 2 * * 1" # every Monday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "update-vanilla-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  update-vanilla:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Fetch vanilla textures
        run: node scripts/fetch-vanilla.js

      - name: Commit changes
        id: commit
        run: |
          git add -- vanilla-textures
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh vanilla textures"
          git push
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Deploy updated textures
        if: steps.commit.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run static.yml --ref "$GITHUB_REF_NAME"
